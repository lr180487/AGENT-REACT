[project]
name = "agente-react-rag"
version = "5.0.0"
description = "Agente ReAct + RAG con FastAPI, PostgreSQL/pgvector y fallback SQLite"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "upstash-redis>=1.8",
  "upstash-vector>=0.8",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "langchain-core>=0.3",
]
[project.scripts]
agente-react-rag = "app.main:app"
[build-system]
requires=["uv_build>=0.9,<1"]
build-backend="uv_build"
